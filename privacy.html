<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privacy &amp; data · Slaton Games</title>
<meta name="theme-color" content="#071422">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<style>
  :root { --bg: #071422; --panel: #0f2032; --line: rgba(255,170,60,.22); --ink: #eef3f6; --muted: #93a9b8; --sun: #ffa62b; --sun2: #ffc95a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px max(18px, env(safe-area-inset-left)) 48px max(18px, env(safe-area-inset-right)); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 640px; margin: 0 auto; }
  a { color: var(--sun2); }
  .back { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 700; margin-bottom: 24px; }
  .back img { width: 44px; height: 44px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 26px; }
  .game { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin: 0 0 16px; }
  .game h2 { margin: 0 0 10px; font-size: 20px; }
  ul { margin: 0; padding-left: 20px; }
  li { margin: 4px 0; }
  footer { color: var(--muted); font-size: 14px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <a class="back" href="./"><img src="img/logo-512.png" alt="">Slaton Games</a>
  <h1>Privacy &amp; data</h1>
  <p class="lead">Privacy policies and data requests for each Slaton Games app.</p>

  <section class="game">
    <h2>Farwatch: Logic Puzzle</h2>
    <ul>
      <li><a href="https://jeremydslaton-ux.github.io/farwatch-site/privacy.html">Privacy policy</a></li>
      <li><a href="https://jeremydslaton-ux.github.io/farwatch-site/delete-data.html">Delete your data</a></li>
    </ul>
  </section>

  <section class="game">
    <h2>Still Waters: Ashgrove Mystery</h2>
    <ul>
      <li><a href="https://jeremydslaton-ux.github.io/still-waters-site/privacy.html">Privacy policy</a></li>
    </ul>
  </section>

  <footer>Questions or requests: <a href="mailto:slatongames@gmail.com">slatongames@gmail.com</a></footer>
</main>
</body>
</html>
